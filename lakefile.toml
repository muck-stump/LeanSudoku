name = "LeanSudoku"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanSudoku", "Games"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
# How deep goals pretty-print before eliding to `⋯`. The generated games'
# answer-key conclusion is an 81-deep conjunction: at 6 it collapses to a
# couple of lines, keeping the board widget near the top of the infoview.
# Display-only; see README, "Generate a game file".
pp.deepTerms.threshold = 6

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "LeanSudoku"

# Game files (played proofs live here; unplayed ones still build, with `sorry`).
[[lean_lib]]
name = "Games"
